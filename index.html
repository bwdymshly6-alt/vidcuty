<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قص وتحميل يوتيوب - Smart Cutter</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: linear-gradient(135deg, #f5f7fa, #c3cfe2); color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .app-container { width: 100%; max-width: 480px; background: #ffffff; border-radius: 24px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); overflow: hidden; display: flex; flex-direction: column; }
        .app-header { background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; padding: 25px 20px; text-align: center; }
        .app-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 5px; }
        .app-header p { font-size: 13px; opacity: 0.9; }
        .app-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 14px; font-weight: 600; color: #444; }
        .input-wrapper { display: flex; gap: 8px; }
        .input-wrapper input { flex-grow: 1; padding: 12px 15px; border: 2px solid #e1e1e1; border-radius: 12px; font-size: 14px; outline: none; transition: border-color 0.3s; }
        .input-wrapper input:focus { border-color: #ff4b2b; }
        .btn-primary { background: #ff4b2b; color: white; border: none; padding: 0 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-primary:hover { background: #e03e1e; }
        .video-section { display: none; flex-direction: column; gap: 15px; background: #fafafa; padding: 15px; border-radius: 16px; border: 1px solid #eee; }
        .video-container { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 12px; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .cutter-tools { display: flex; flex-direction: column; gap: 12px; }
        .time-inputs { display: flex; gap: 10px; }
        .time-box { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .time-box label { font-size: 12px; color: #666; font-weight: 600; }
        .time-box input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 14px; }
        .quality-section { display: flex; flex-direction: column; gap: 8px; }
        .quality-options { display: flex; gap: 10px; }
        .quality-option { flex: 1; padding: 10px; text-align: center; border: 2px solid #e1e1e1; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; background: white; }
        .quality-option.selected { border-color: #ff4b2b; background: #fff5f3; color: #ff4b2b; }
        .btn-download { background: linear-gradient(135deg, #11998e, #38ef7d); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: opacity 0.3s; box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3); }
        .btn-download:hover { opacity: 0.9; }
        .status-message { text-align: center; font-size: 13px; color: #11998e; background: #e8f8f5; padding: 10px; border-radius: 8px; display: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <h1>قص وتحميل يوتيوب</h1>
            <p>عبر سيرفر آمن ونظيف 100%</p>
        </div>
        <div class="app-body">
            <div class="input-group">
                <label for="video-url">رابط فيديو اليوتيوب أو البث المباشر</label>
                <div class="input-wrapper">
                    <input type="text" id="video-url" placeholder="الصق الرابط هنا...">
                    <button class="btn-primary" onclick="loadVideo()">عرض</button>
                </div>
            </div>
            <div class="video-section" id="videoSection">
                <div class="video-container" id="playerContainer"></div>
                <div class="cutter-tools">
                    <label style="font-size: 13px; font-weight: 600; color: #555;">تحديد وقت الجزء المطلوب:</label>
                    <div class="time-inputs">
                        <div class="time-box">
                            <label>من (البداية)</label>
                            <input type="text" id="startTime" value="00:00">
                        </div>
                        <div class="time-box">
                            <label>إلى (النهاية)</label>
                            <input type="text" id="endTime" value="00:30">
                        </div>
                    </div>
                </div>
                <div class="quality-section">
                    <label style="font-size: 13px; font-weight: 600; color: #555;">اختر الجودة المطلوبة:</label>
                    <div class="quality-options">
                        <div class="quality-option" onclick="selectQuality(this, '360')">360p</div>
                        <div class="quality-option selected" onclick="selectQuality(this, '720')">720p HD</div>
                        <div class="quality-option" onclick="selectQuality(this, '1080')">1080p FHD</div>
                    </div>
                </div>
                <button class="btn-download" onclick="startDownload()">الانتقال للتحميل السريع</button>
                <div class="status-message" id="statusMessage"></div>
            </div>
        </div>
    </div>
    <script>
        let selectedQualityValue = '720';
        let currentVideoFullUrl = '';

        function extractYouTubeId(url) {
            if (!url) return null;
            url = url.trim();
            currentVideoFullUrl = url;

            if (url.includes('/live/')) {
                let parts = url.split('/live/');
                if (parts[1]) return parts[1].split('?')[0].split('&')[0];
            }
            if (url.includes('youtu.be/')) {
                let parts = url.split('youtu.be/');
                if (parts[1]) return parts[1].split('?')[0].split('&')[0];
            }
            if (url.includes('watch?v=')) {
                let parts = url.split('watch?v=');
                if (parts[1]) return parts[1].split('&')[0].split('?')[0];
            }
            if (url.length >= 10 && !url.includes('/')) {
                return url.split('?')[0];
            }
            return null;
        }

        function loadVideo() {
            const urlInput = document.getElementById('video-url').value;
            const videoId = extractYouTubeId(urlInput);
            const videoSection = document.getElementById('videoSection');
            const playerContainer = document.getElementById('playerContainer');

            if (!videoId) {
                alert('الرابط غير صالح، تأكد من نسخ رابط يوتيوب أو بث مباشر صحيح.');
                return;
            }

            videoSection.style.display = 'flex';
            playerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>`;
        }

        function selectQuality(element, quality) {
            document.querySelectorAll('.quality-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedQualityValue = quality;
        }

        function startDownload() {
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            const statusMessage = document.getElementById('statusMessage');

            if(!startTime || !endTime) {
                alert('الرجاء تحديد أوقات البداية والنهاية.');
                return;
            }

            statusMessage.style.display = 'block';
            statusMessage.innerHTML = `جاري توجيهك إلى سيرفر التحميل النظيف (جودة ${selectedQualityValue}p)...`;

            setTimeout(() => {
                // توجيه الرابط إلى خدمة cobalt.tools النظيفة والخالية من الإعلانات
                let cobaltUrl = `https://cobalt.tools/?url=${encodeURIComponent(currentVideoFullUrl)}`;
                window.open(cobaltUrl, '_blank');
            }, 1000);
        }
    </script>
</body>
</html>
